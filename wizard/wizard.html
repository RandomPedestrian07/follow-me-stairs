<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Follow-Me Setup</title>
<!--
  Follow-Me setup wizard.

  Data: radar targets from the sensor's /followme/targets (raw, polled about
  8/s while the page is open), and the follow-me settings and device name
  from the web server's event stream (/events). Device address: ?host=, else
  the page's own origin when the sensor serves it (meta followme-on-device),
  else the last address entered in the address bar. ?sim=1 starts the
  simulated walker. The LD2450 reports x mirrored; x is negated on arrival
  and again when saving.

  State: kept per sensor address in localStorage. Nothing about the stairs is
  pre-picked; Next stays off until each screen is answered.

  Sensor: on connect the stored setup is read from /followme/calibration.
  When its wizard state differs from this page's, it is loaded, or offered
  when this page has unsaved changes. "Save to sensor" (end of the strip
  match) posts the calibration and the wizard state there. While the strip
  match is open, /followme/preview lights the chosen LED on the strip. The
  Test screen's sliders are the sensor's Follow-Me number entities, set
  through the web server's number endpoints, with their ranges from the
  event stream.

  WLED: "Read" takes the LED count and strip type from /json/info and checks
  the realtime settings in /json/cfg that follow-me relies on; "Fix WLED
  settings" writes the ones that are off.

  Screens: shape (straight, L, U; upper and lower floor can be flipped),
  step counts, stair width and units, strip wall and LED 1 end, walk, strip
  match, test walk.

  Walk: taps at the lower floor (start), the first step, the last step before
  the landing and the first step after it (L and U), the last step, and on
  the upper floor. Step taps are tread middles. The trail is fitted with one
  line (straight) or two lines (L, U); the stairs' centre line is rebuilt from
  the fit (L corner = line intersection, U landing = end of the first flight
  projected onto the second). Each flight's tread run comes from its taps and
  step count; the flight starts half a run before its first tap and ends half
  a run after its last. During the walk each tap is an anchor and the live
  dot follows a line through the samples since it, once past a deadband.

  Drawing: everything is drawn on the template stairs; radar points are
  translated by matching distance along the stairs feature to feature
  (floor, first step, landing edges, last step, floor) and keeping the
  sideways offset (mirrored when the walk turns the other way from the stairs
  as described). The sensor is drawn where the radar's origin falls. LED pins
  are those features; the glow is tracked in radar distances and drawn on the
  template strip wall.

  Fonts: IBM Plex from fonts/ (SIL OFL 1.1).
-->
<style>
/* IBM Plex (SIL OFL 1.1, fonts/OFL.txt), Latin subset. Inlined when the sensor serves the page. */
@font-face{font-family:"IBM Plex Sans";font-weight:100 700;font-display:swap;src:url(fonts/plex-sans.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/plex-mono-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500 600;font-display:swap;src:url(fonts/plex-mono-500.woff2) format("woff2")}
:root{
  --bg:#07090a; --panel:#0e0e10;
  --ink:#dfd8c9; --ink-2:rgba(223,216,201,.62); --ink-3:rgba(223,216,201,.36); --ink-4:rgba(223,216,201,.14);
  --line:rgba(223,216,201,.1); --line-2:rgba(223,216,201,.2);
  --warm:#c28947; --warm-2:#c2a37a;
  --fill:#2e281b; --fill-ink:#dddad6; --fill-hover:#3a3324;   /* solid buttons, toast, progress */
  --bad:#c2695d;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input{font:inherit;color:inherit}
.mono{font-family:var(--mono)}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:max(14px,env(safe-area-inset-top)) 20px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand b{font:500 12px/1 var(--mono);letter-spacing:.18em}
.brand span{font:12px/1 var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.sim{display:flex;align-items:center;gap:7px;font:11px/1 var(--mono);letter-spacing:.12em;color:var(--ink-3);cursor:pointer;user-select:none}
.sim input{appearance:none;width:12px;height:12px;border:1px solid var(--ink-3);margin:0;border-radius:2px;display:grid;place-items:center}
.sim input:checked{border-color:var(--warm);background:var(--warm)}
.live{display:flex;align-items:center;gap:7px;font:11px/1 var(--mono);letter-spacing:.12em;color:var(--ink-3)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
.live.on i{background:var(--ink);box-shadow:0 0 8px var(--ink)}
.live.sim i{background:var(--warm);box-shadow:0 0 8px var(--warm)}
.live.off i{background:var(--bad)}

/* sensor address bar */
.hostbar{position:fixed;left:0;right:0;top:47px;z-index:5;display:flex;align-items:flex-end;gap:12px;padding:12px 20px 14px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.hostbar[hidden]{display:none}
.hostbar .field{flex:1;max-width:340px}
.hostnote{font-size:13px;color:var(--warm-2);align-self:center}
.live{cursor:pointer}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100dvh - 47px - 73px)}
.draw{position:relative;background:var(--panel);border-right:1px solid var(--line);overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;background-position:-1px -1px}
.draw::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(7,9,10,.85) 100%);pointer-events:none}
.draw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.draw .crop{position:absolute;width:14px;height:14px;border-color:var(--ink-3);border-style:solid;border-width:0;pointer-events:none}
.crop.tl{left:12px;top:12px;border-left-width:1px;border-top-width:1px}
.crop.tr{right:12px;top:12px;border-right-width:1px;border-top-width:1px}
.crop.bl{left:12px;bottom:12px;border-left-width:1px;border-bottom-width:1px}
.crop.br{right:12px;bottom:12px;border-right-width:1px;border-bottom-width:1px}
.readout{position:absolute;right:20px;top:18px;font:11px/1.6 var(--mono);color:var(--ink-3);letter-spacing:.06em;text-align:right;pointer-events:none}
.stripbox{position:absolute;left:20px;right:20px;bottom:18px;height:60px;pointer-events:none}
.stripbox canvas{position:static;width:100%;height:100%}

/* question column */
.q{padding:28px 28px 40px;overflow:auto}
.kicker{font:11px/1 var(--mono);letter-spacing:.16em;color:var(--ink-3);margin-bottom:14px}
.kicker em{font-style:normal;color:var(--ink)}
.q h1{font:600 26px/1.15 var(--sans);letter-spacing:-.015em;margin:0 0 10px}
.q .help{color:var(--ink-2);margin:0 0 22px;font-size:14.5px}
.fine{font-size:12.5px;color:var(--ink-3);margin-top:16px}
.group{font:11px/1 var(--mono);letter-spacing:.16em;color:var(--ink-3);margin:22px 0 8px}

/* option rows */
.opts{border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:13px 2px;background:none;border:0;border-bottom:1px solid var(--line);
  text-align:left;cursor:pointer;color:var(--ink-2)}
.opt svg{width:22px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:square;opacity:.7}
.opt span{flex:1;display:flex;flex-direction:column}
.opt b{font-weight:500;color:var(--ink-2)}
.opt small{font-size:12.5px;color:var(--ink-3)}
.opt i{width:10px;height:10px;border:1px solid var(--ink-3);flex:none;transform:rotate(45deg)}
.opt:hover b{color:var(--ink)}
.opt.sel b{color:var(--ink)}
.opt.sel svg{opacity:1;color:var(--ink)}
.opt.sel i{background:var(--warm);border-color:var(--warm);box-shadow:0 0 10px rgba(194,137,71,.6)}
.opt .val{font:13px/1 var(--mono);color:var(--ink-3)}
.opt.sel .val{color:var(--warm-2)}

/* steppers */
.num{display:flex;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.num:first-child{border-top:1px solid var(--line)}
.num label{flex:1;color:var(--ink-2)}
.num .ctl{display:flex;align-items:center}
.num button{width:34px;height:34px;border:1px solid var(--line-2);background:none;cursor:pointer;font:16px/1 var(--mono);color:var(--ink-2)}
.num button:hover{border-color:var(--ink-3);color:var(--ink)}
.num output{width:70px;text-align:center;font:500 18px/1 var(--mono);font-variant-numeric:tabular-nums}
.num output small{font-size:11px;color:var(--ink-3);margin-left:3px}

/* buttons */
.go{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;background:var(--fill);color:var(--fill-ink);
  padding:13px 18px;font:500 14px/1 var(--sans);letter-spacing:.01em;cursor:pointer;border-radius:3px}
.go:hover{background:var(--fill-hover)}
.go:disabled{background:var(--ink-4);color:var(--ink-3);cursor:default}
.go.wide{width:100%;padding:16px}
.go.rec{background:var(--warm);color:#1b1006}
.line{border:1px solid var(--line-2);background:none;padding:11px 16px;cursor:pointer;border-radius:3px;color:var(--ink-2);font-size:14px}
.line:hover{border-color:var(--ink-3);color:var(--ink)}
.line:disabled{opacity:.4;cursor:default}
.ghost{border:0;background:none;color:var(--ink-2);cursor:pointer;padding:12px 6px;font-size:14px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.warn{border-left:2px solid var(--warm);padding:6px 0 6px 12px;margin:10px 0;font-size:13px;color:var(--warm-2)}
.verdict{font:600 17px/1.3 var(--sans);color:var(--ink);margin:0 0 14px}
.verdict.bad{color:var(--warm)}
.stretches{border-top:1px solid var(--line)}
.stretch{display:grid;grid-template-columns:22px 1fr auto;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.stretch i{font:600 13px/1 var(--mono);font-style:normal;color:var(--ink-3)}
.stretch .val{font:13px/1 var(--mono);color:var(--ink-3)}
.stretch small{grid-column:2/4;font-size:12.5px;color:var(--warm-2);margin-top:5px}
.stretch.bad i,.stretch.bad b{color:var(--warm)}
.stretch b{font-weight:500}
.raw{margin-top:18px}
.raw summary{cursor:pointer;font:11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:6px 0}
.raw summary:hover{color:var(--ink-2)}
.raw pre{font:11px/1.5 var(--mono);color:var(--ink-2);background:rgba(255,255,255,.03);border:1px solid var(--line);
  padding:10px;margin:8px 0 10px;overflow-x:auto;white-space:pre;user-select:text;-webkit-user-select:text}

/* led picker */
.ledpick{display:flex;align-items:center;gap:6px;margin:18px 0 6px}
.ledpick .big{flex:1;text-align:center;font:500 34px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ledpick .big small{display:block;font-size:10px;letter-spacing:.16em;color:var(--ink-3);margin-top:6px}
.ledpick button{width:44px;height:38px;border:1px solid var(--line-2);background:none;cursor:pointer;font:12px/1 var(--mono);color:var(--ink-2)}
.ledpick button:hover{border-color:var(--ink-3);color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line-2)}
input[type=range]::-moz-range-track{height:1px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-7px;background:var(--bg);border:1px solid var(--ink);transform:rotate(45deg)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--bg);border:1px solid var(--ink);border-radius:0}
.field{display:flex;flex-direction:column;gap:6px;font:11px/1 var(--mono);letter-spacing:.14em;color:var(--ink-3)}
.input{background:none;border:0;border-bottom:1px solid var(--line-2);padding:8px 0;outline:none;font:14px/1.2 var(--mono);color:var(--ink);letter-spacing:0;min-width:0;width:100%}
.input:focus{border-color:var(--ink-2)}
.tbl{font:12.5px/1.65 var(--mono);color:var(--ink-2);margin:8px 0 10px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:pre;overflow-x:auto;user-select:text;-webkit-user-select:text}
.tbl b{color:var(--ink-3);font-weight:400}
.tune{margin:4px 0 6px}
.tune .t{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2)}
.tune .t b{font:500 13px var(--mono);color:var(--ink)}

/* footer */
.bar{position:fixed;left:0;right:0;bottom:0;height:73px;display:flex;align-items:center;gap:14px;padding:0 20px env(safe-area-inset-bottom);
  border-top:1px solid var(--line);background:rgba(7,9,10,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5}
.prog{flex:1;display:flex;flex-direction:column;gap:7px;align-items:center}
.prog .count{font:11px/1 var(--mono);letter-spacing:.16em;color:var(--ink-3)}
.prog .ticks{display:flex;gap:4px}
.prog .ticks i{width:18px;height:2px;background:var(--ink-4)}
.prog .ticks i.done{background:var(--ink-3)}
.prog .ticks i.on{background:var(--fill)}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,8px);opacity:0;background:var(--fill);color:var(--fill-ink);padding:10px 14px;
  font-size:13.5px;border-radius:3px;transition:.2s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .stage{display:block;height:auto}
  .draw{height:min(56vh,520px);border-right:0;border-bottom:1px solid var(--line)}
  .q{padding:22px 16px 110px;overflow:visible}
  .q h1{font-size:23px}
  .top{padding-left:16px;padding-right:16px}
  .bar{padding-left:12px;padding-right:12px}
  .brand span{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>FOLLOW-ME</b><span id="dev">connecting</span></div>
  <div class="sp"></div>
  <label class="sim"><input type="checkbox" id="simToggle">SIM</label>
  <div class="live off" id="live"><i></i><span id="liveTxt">OFFLINE</span></div>
</header>

<div class="hostbar" id="hostbar" hidden>
  <label class="field">SENSOR ADDRESS<input class="input" id="hostInput" placeholder="192.168.1.60" autocomplete="off" spellcheck="false"></label>
  <button class="line" id="hostGo" style="padding:8px 14px">Connect</button>
  <span class="hostnote" id="hostNote"></span>
</div>
<div class="hostbar" id="loadbar" hidden>
  <span class="hostnote" style="flex:1">This sensor has a saved setup that differs from this page. Load it? Your unsaved changes here are replaced.</span>
  <button class="line" id="loadYes" style="padding:8px 14px">Load it</button>
  <button class="ghost" id="loadNo">Keep mine</button>
</div>

<main class="stage">
  <div class="draw" id="draw">
    <canvas id="cv"></canvas>
    <div class="crop tl"></div><div class="crop tr"></div><div class="crop bl"></div><div class="crop br"></div>
    <div class="readout" id="readout"></div>
    <div class="stripbox" id="stripbox" hidden><canvas id="strip"></canvas></div>
  </div>
  <aside class="q">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p class="help" id="help"></p>
    <div id="body"></div>
  </aside>
</main>

<footer class="bar">
  <button class="ghost" id="back">← Back</button>
  <div class="prog"><div class="count" id="count"></div><div class="ticks" id="ticks"></div></div>
  <button class="go" id="next">Next →</button>
</footer>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

const KEY = 'followme-wizard-v3';
const IN = 25.4;
const RUN = 254;          // tread run used to draw the template before a walk, mm
const GAP = 150;          // gap between U flights in the template drawing, mm
const SAMPLE_HZ = 6;      // simulated radar rate
const TYPICAL_RUN = 260;  // tread run assumed for a one-step flight, mm (a walk cannot measure it)

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const add = (a, b) => ({x: a.x + b.x, y: a.y + b.y});
const sub = (a, b) => ({x: a.x - b.x, y: a.y - b.y});
const mul = (a, k) => ({x: a.x * k, y: a.y * k});
const dot = (a, b) => a.x * b.x + a.y * b.y;
const len = a => Math.hypot(a.x, a.y);
const unit = (a, b) => { const d = sub(b, a), L = len(d) || 1; return {x: d.x / L, y: d.y / L}; };
const rnorm = u => ({x: u.y, y: -u.x});          // right-hand side of walking direction u
const pad2 = n => String(n).padStart(2, '0');
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

// ---------- shapes ----------
// The template is drawn one way round; S.reversed walks it from the other end,
// which mirrors the turn (an L turning right going up turns left going down).
const SHAPES = {
  'straight': {label: 'Straight', sub: 'One flight, no turn', kind: 'I', icon: 'M12 28V4'},
  'L':        {label: 'L-shaped', sub: 'Two flights with a landing, turning a corner', kind: 'L', icon: 'M7 28V9h14'},
  'U':        {label: 'U-shaped', sub: 'Switchback, flights side by side', kind: 'U', icon: 'M5 28V5h14v23'},
};
const FLOOR_DEPTH = 700;  // floor patch drawn beyond each end until a walk measures it, mm
const FLOOR_STOP = 610;   // where the walk's last stop is drawn on the upper floor, mm
const FEAT = {
  'bottom':   {label: 'Front edge of the bottom step', tag: 'BOTTOM', required: true},
  'land-in':  {label: 'Where the lower flight meets the landing', tag: 'LANDING'},
  'land-out': {label: 'Where the landing meets the upper flight', tag: 'LANDING'},
  'top':      {label: 'Top edge of the top step', tag: 'TOP', required: true},
};
const pinFeats = plan => plan.feats.filter(f => FEAT[f.key]);
const SCREENS = [
  {key: 'shape',  name: 'SHAPE',  title: 'What shape are your stairs?', help: 'Pick the closest match, then check the floor labels. If upper and lower are backwards, flip them.'},
  {key: 'steps',  name: 'STEPS',  title: 'How many steps?', help: "Count the treads you step on in each flight. Don't count a landing or the floor at the top."},
  {key: 'strip',  name: 'STRIP',  title: 'Where does the light run?', help: 'Pick the wall the strip is on, then say which end LED 1 is at.'},
  {key: 'walk',   name: 'WALK',   title: 'Walk up the stairs', help: ''},
  {key: 'match',  name: 'MATCH',  title: 'Line up the strip', help: 'For each mark, move the lit LED until it sits at that spot on your stairs.'},
  {key: 'test',   name: 'TEST',   title: 'Take it for a walk', help: 'Walk the stairs and tune until the light feels right.'},
];
const SC = Object.fromEntries(SCREENS.map((s, i) => [s.key, i]));

// ---------- units ----------
// Imperial where the phone's region uses it, metric elsewhere; switchable on the steps screen.
const IMPERIAL_REGIONS = ['US', 'LR', 'MM'];
const defaultUnits = () => IMPERIAL_REGIONS.includes((navigator.language || '').split('-')[1]) ? 'imperial' : 'metric';
const imperial = () => S.units === 'imperial';
const fmtLen = mm => imperial() ? (mm >= 914 ? `${(mm / 304.8).toFixed(1)} ft` : `${Math.round(mm / IN)} in`) : (mm >= 1000 ? `${(mm / 1000).toFixed(1)} m` : `${Math.round(mm / 10)} cm`);

// ---------- state ----------
// Kept per sensor address in localStorage. Nothing is pre-picked: every
// answer about the stairs comes from the person setting them up.
const fresh = () => ({
  screen: 0, shape: null, reversed: false, steps: null, width: null, units: defaultUnits(),
  stripSide: null, stripStart: null,
  cl: null, trail: [], marks: null, pins: {}, ledCount: null, ledWhite: null, wledHost: '', feat: 'bottom', cursor: 1,
  tune: {}, rev: null, dirty: false,
});
const S = fresh();
// Sensor address: ?host=, else the page's own origin when the sensor serves
// it (marked by <meta name="followme-on-device">), else the last one entered.
const ON_DEVICE = !!document.querySelector('meta[name="followme-on-device"]');
function host() {
  const q = new URLSearchParams(location.search).get('host');
  if (q) return q;
  if (ON_DEVICE) return location.host;
  try { return localStorage.getItem(KEY + '-host') || ''; } catch (e) { return ''; }
}
const stateKey = () => `${KEY}:${host()}`;
// Wizard state from storage or the sensor: only known keys with sane types.
function sanitize(o) {
  const out = {}, isPt = p => p && Number.isFinite(p.x) && Number.isFinite(p.y);
  if (!o || typeof o !== 'object') return out;
  if (SHAPES[o.shape]) out.shape = o.shape;
  if (typeof o.reversed === 'boolean') out.reversed = o.reversed;
  if (Array.isArray(o.steps) && o.steps.length >= 1 && o.steps.length <= 2 && o.steps.every(n => n == null || (Number.isInteger(n) && n >= 1 && n <= 40))) out.steps = o.steps;
  if (Number.isFinite(o.width) && o.width >= 300 && o.width <= 2500) out.width = o.width;
  if (o.units === 'imperial' || o.units === 'metric') out.units = o.units;
  if (['inside', 'outside', 'left', 'right'].includes(o.stripSide)) out.stripSide = o.stripSide;
  if (o.stripStart === 'bottom' || o.stripStart === 'top') out.stripStart = o.stripStart;

  const pts = S.trail.filter(q => q.t >= A.t), cur = pts[pts.length - 1];
  if (!cur || len(sub(cur, A.p)) < LIVE_DEADBAND) return A.d;
  const dir = principalDir([A.p, ...pts], sub(cur, A.p));
  return clamp(A.d + dot(sub(cur, A.p), dir), A.d, next);
}
// Plain-http pages (the sensor's own) have no clipboard API: select the text instead.
function copyRaw() {
  const text = $('rawText').textContent;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('Copied'), () => selectRaw());
  } else selectRaw();
}
function selectRaw() {
  const sel = getSelection(), range = document.createRange();
  range.selectNodeContents($('rawText')); sel.removeAllRanges(); sel.addRange(range);
  toast('Selected. Copy it from here.');
}
function startWalk() {
  const now = Date.now();
  rec = true; walkStage = 0; walkTaps = {start: now};
  walkAnchors = [{p: null, d: START_D, t: now}]; liveDots = []; liveShown = null;
  S.trail = []; S.cl = null; S.marks = null; S.pins = {};
  simD = START_D; simTick = -1;
  save(); render();
}
function walkTap() {
  const st = walkStops(tpOf())[walkStage], now = Date.now();
  if (st.key === 'done') return stopWalk(true);
  walkTaps[st.key] = now;
  walkAnchors.push({p: S.trail.length ? S.trail[S.trail.length - 1] : null, d: st.d, t: now});
  walkStage++; render();
}
// Position at time t, interpolated between the radar samples around it.
function trailAt(t) {
  const tr = S.trail, i = tr.findIndex(q => q.t >= t);
  if (i < 0) return tr[tr.length - 1];
  if (i === 0) return tr[0];
  const a = tr[i - 1], b = tr[i], k = (t - a.t) / ((b.t - a.t) || 1);
  return {x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k};
}
function stopWalk(doFit) {
  rec = false; walkStage = -1;
  if (doFit) {
    const cl = fitWalk(S.trail);
    if (!cl) toast('Not enough of a walk to go on. Try again, a bit slower.');
    else {
      S.cl = cl;
      S.marks = {bottom: trailAt(walkTaps.first), top: trailAt(walkTaps.last)};
      if (walkTaps.lastLower) { S.marks.lastLower = trailAt(walkTaps.lastLower); S.marks.firstUpper = trailAt(walkTaps.firstUpper); }
      const ro = radarOpts();
      if (ro.top - ro.bottom < 300) { S.cl = null; S.marks = null; toast('The first and last step came out on top of each other. Try again.'); }
      else toast('Got it');
    }
  }

}

// ---------- pointer: floors, sensor spots, strip wall ----------
const cv = $('cv');
function local(e) { const r = cv.getBoundingClientRect(); return {X: e.clientX - r.left, Y: e.clientY - r.top}; }
function inPoly(P, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[i], b = pts[j];
    if ((a.y > P.y) !== (b.y > P.y) && P.x < (b.x - a.x) * (P.y - a.y) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}
function distToPoly(P, pts) {
  let best = Infinity;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], ab = sub(pts[i], a), L2 = dot(ab, ab) || 1, t = clamp(dot(sub(P, a), ab) / L2, 0, 1);
    best = Math.min(best, len(sub(P, add(a, mul(ab, t)))));
  }
  return best;
}
cv.addEventListener('pointerdown', e => {
  const {X, Y} = local(e), P = {x: X, y: Y}, k = SCREENS[S.screen].key;
  if ((k === 'shape' || k === 'steps') && S.shape && shape().kind !== 'I' && lastFloors.some(f => inPoly(P, f))) { flip(); return; }
  if (k === 'strip' && lastWalls) {
    const dl = distToPoly(P, lastWalls.left), dr = distToPoly(P, lastWalls.right);
    if (Math.min(dl, dr) >= 40) return;
    const lr = dl < dr ? 'left' : 'right';
    S.stripSide = shape().kind === 'I' ? lr : lr === insideSide() ? 'inside' : 'outside';
    save(); render();
  }
});
// ---------- glow (test screen) ----------
const glow = {pos: null, center: null, shown: null, alpha: 0, lastSeen: -1e9};
function tickGlow(dt, now, plan, ts) {
  let best = null;
  for (const t of ts) { const p = project(plan.cl, plan.m, t); if (p.off < 0.8 * dispWidth() && (!best || p.off < best.off)) best = p; }
  // one step = the mean tread run, as the sensor counts it
  const run = plan.flights.reduce((a, f) => a + len(sub(f.b, f.a)), 0) / plan.flights.reduce((a, f) => a + f.n, 0);
  const tune = Object.assign({window: 3, buffer: 1, smooth: 50, hold: 4}, S.tune);
  const half = tune.window * run / 2, margin = Math.max(0, half - tune.buffer * run);
  if (best) {
    const k = 1 - Math.exp(-dt * (1 + (100 - tune.smooth) / 100 * 14));
    glow.pos = glow.pos == null ? best.along : glow.pos + (best.along - glow.pos) * k;
    if (glow.center == null || glow.alpha < .01) glow.center = glow.shown = glow.pos;
    if (glow.pos > glow.center + margin) glow.center = glow.pos - margin;
    if (glow.pos < glow.center - margin) glow.center = glow.pos + margin;
    glow.lastSeen = now; glow.alpha = Math.min(1, glow.alpha + dt);
  } else if (now - glow.lastSeen > tune.hold * 1000) {
    glow.alpha = Math.max(0, glow.alpha - dt / 1.5);
    if (glow.alpha === 0) glow.pos = null;
  }
  if (glow.center != null) glow.shown += (glow.center - glow.shown) * (1 - Math.exp(-dt * 6));
  return {center: glow.shown, half, alpha: glow.alpha * glow.alpha * (3 - 2 * glow.alpha)};
}

// ---------- frame ----------
const disp = {};
let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  simT += dt;
  if (simOn()) simUpdate(dt);

  // status
  stamps = stamps.filter(t => Date.now() - t < 5000);
  const L = $('live');
  if (simOn()) { L.className = 'live sim'; $('liveTxt').textContent = 'SIMULATED'; }
  else if (Date.now() - lastMsg < 20000) { L.className = 'live on'; $('liveTxt').textContent = `LIVE · ${(stamps.length / 5).toFixed(1)}/S`; }
  else { L.className = 'live off'; $('liveTxt').textContent = 'OFFLINE'; }

  const k = SCREENS[S.screen].key, ts = targets();
  const {ctx, w, h} = fit(cv);
  ctx.clearRect(0, 0, w, h);
  const stripOn = k === 'match' || k === 'test', padBot = stripOn ? 96 : 48;
  let readout = '';

  if (k === 'shape' && !S.shape) {
    readout = 'PICK A SHAPE';
  } else if (k === 'shape' || k === 'steps' || k === 'strip') {
    const plan = tpOf();
    const pts = [...plan.walls.left, ...plan.walls.right, ...plan.floors.lower, ...plan.floors.upper];
    if (k === 'steps') pts.push(sub(plan.cl[0], mul(plan.flights[0].u, FLOOR_DEPTH + 320)));
    const V = makeView(pts, w, h, 48, 56, padBot);
    drawPlan(ctx, V, plan, {counts: k === 'steps', strip: k === 'strip'});
    lastFloors = [plan.floors.lower, plan.floors.upper].map(f => f.map(p => ({x: V.X(p), y: V.Y(p)})));
    if (k === 'strip') lastWalls = {left: plan.walls.left.map(p => ({x: V.X(p), y: V.Y(p)})), right: plan.walls.right.map(p => ({x: V.X(p), y: V.Y(p)}))};
    drawScale(ctx, V, h, 0);
    readout = k === 'strip' ? 'PLAN · TAP A WALL' : 'PLAN';
  } else {
    // Walk, match and test: everything is placed on the template drawing.
    const tp = tpOf(), rp = rpOf();
    const sensor = sensorSpot(rp, tp);
    const V = makeView([...tp.walls.left, ...tp.walls.right, ...tp.floors.lower, ...tp.floors.upper, ...(sensor ? [sensor.p] : [])], w, h, 48, 56, padBot);
    const stops = k === 'walk' && rec ? walkStops(tp) : null;
    const hiFloor = k === 'walk' && !rec && !S.cl ? 'lower' : stops && stops[walkStage].floor || null;
    drawPlan(ctx, V, tp, {strip: k !== 'walk', hiFloor, hiFloorNote: hiFloor === 'lower' ? 'STAND HERE' : null});
    if (sensor) drawSensor(ctx, V, sensor.p, sensor.aim, true);

    // the next stop: a big dot to stand on, then tap
    if (stops) {
      const st = stops[walkStage], p = pointAt(tp.cl, tp.m, st.d), X = V.X(p), Y = V.Y(p), pulse = (performance.now() % 1600) / 1600;
      ctx.save();
      ctx.beginPath(); ctx.arc(X, Y, 12 + pulse * 30, 0, Math.PI * 2); ctx.strokeStyle = WARM(.85 * (1 - pulse)); ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(X, Y, 11, 0, Math.PI * 2); ctx.fillStyle = WARM(1); ctx.shadowColor = WARM(1); ctx.shadowBlur = 18; ctx.fill();
      ctx.shadowBlur = 0; ctx.textAlign = 'center';
      ctx.font = MONO(10.5, 600);
      const t1 = st.label, w1 = ctx.measureText(t1).width + 12;
      ctx.fillStyle = WARM(1); ctx.fillRect(X - w1 / 2, Y + 20, w1, 18);
      ctx.fillStyle = '#1b1006'; ctx.fillText(t1, X, Y + 33);
      ctx.font = MONO(9, 500);
      const t2 = 'STAND HERE, THEN TAP', w2 = ctx.measureText(t2).width + 10;
      ctx.fillStyle = 'rgba(14,14,16,.92)'; ctx.fillRect(X - w2 / 2, Y + 39, w2, 15);
      ctx.fillStyle = WARM(.9); ctx.fillText(t2, X, Y + 50);
      ctx.restore();

      // you, live: painted trail and the dot
      const target = liveAlong(st.d);
      liveShown = liveShown == null ? target : liveShown + (target - liveShown) * (1 - Math.exp(-dt * 4));
      ctx.save(); ctx.fillStyle = WARM(.45);
      for (const d of liveDots) { const q = pointAt(tp.cl, tp.m, d); ctx.beginPath(); ctx.arc(V.X(q), V.Y(q), 2.2, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
      if (walkAnchors.length && walkAnchors[walkAnchors.length - 1].p) drawTarget(ctx, V, pointAt(tp.cl, tp.m, liveShown), true);
    }

    // pick the target to follow / record
    const lastS = S.trail[S.trail.length - 1];
    let used = -1, bd = Infinity;
    ts.forEach((t, i) => {
      const d = rec && lastS ? len(sub(t, lastS)) : rp ? project(rp.cl, rp.m, t).off : len(t);
      if (d < bd) { bd = d; used = i; }
    });
    if (newSample) {
      newSample = false;
      if (rec && used >= 0) {
        const q = {x: Math.round(ts[used].x), y: Math.round(ts[used].y), t: Date.now()};
        S.trail.push(q);
        for (const A of walkAnchors) if (!A.p) A.p = q;          // a tap made before any sample arrived
        if (stops) liveDots.push(liveAlong(stops[walkStage].d));
        const rc = $('recCount'); if (rc) rc.textContent = `${S.trail.length} SAMPLES`;
      }
    }
    const onStairs = p => rp && toTemplate(rp, tp, p).off < 0.8 * dispWidth();

    if (k === 'walk' && rp && !rec) {
      // stretches that failed the report, tinted on the drawing
      const bad = new Set((lastReport ? lastReport.stretches : []).filter(s => s.why).map(s => s.key)), wd = dispWidth();
      const flightPoly = f => { const n = mul(rnorm(f.u), wd / 2); return [sub(f.a, n), add(f.a, n), add(f.b, n), sub(f.b, n)]; };
      const polys = {flight: tp.flights[0], lower: tp.flights[0], upper: tp.flights[1]};
      ctx.save();
      for (const key of bad) {
        const poly = key === 'landing' ? tp.landing : polys[key] && flightPoly(polys[key]);
        if (!poly) continue;
        polyline(ctx, V, poly, true); ctx.fillStyle = WARM(.16); ctx.fill();
        ctx.strokeStyle = WARM(.8); ctx.lineWidth = 1.5; ctx.stroke();
      }
      // raw radar dots, only while the raw numbers are open
      rawAlpha += ((rawOpen ? 1 : 0) - rawAlpha) * (1 - Math.exp(-dt * 8));
      if (rawAlpha > .01) {
        ctx.fillStyle = WARM(.7 * rawAlpha);
        for (const p of S.trail) { const q = toTemplate(rp, tp, p).pt; ctx.beginPath(); ctx.arc(V.X(q), V.Y(q), 2.2, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.restore();
    }
    if (k === 'match' && rp) {
      const a = anchors(rp, true), f = tp.feats.find(f => f.key === S.feat) || pinFeats(tp)[0], p = wallPoint(tp, f.d);
      const X = V.X(p), Y = V.Y(p);
      ctx.save(); ctx.translate(X, Y); ctx.rotate(Math.PI / 4);
      ctx.shadowColor = WARM(1); ctx.shadowBlur = 14; ctx.fillStyle = WARM(1); ctx.fillRect(-5, -5, 10, 10); ctx.restore();
      ctx.save(); ctx.fillStyle = ink(.85); ctx.font = MONO(9.5, 500); ctx.textAlign = 'left'; ctx.fillText(FEAT[f.key].tag, X + 12, Y - 10); ctx.restore();
      drawStrip(i => i === S.cursor ? 1 : 0, pinFeats(rp).map(ff => S.pins[ff.key] != null
        ? {led: S.pins[ff.key], label: FEAT[ff.key].tag} : null).filter(Boolean)
        .concat(a.filter(q => q.auto).map(q => ({led: q.led, label: FEAT[q.key].tag, auto: true}))));
    }
    if (k === 'test' && rp) {
      // the glow is tracked in radar distances and drawn at the matching spot on the template wall
      const g = tickGlow(dt, now, rp, ts);
      if (g.alpha > .004 && g.center != null) {
        const dB = rp.feats.find(f => f.key === 'bottom').d, dT = rp.feats.find(f => f.key === 'top').d;
        const d0 = clamp(g.center - g.half, dB, dT), d1 = clamp(g.center + g.half, dB, dT), pts2 = [];
        for (let d = d0; d <= d1; d += 25) pts2.push(wallPoint(tp, mapAlong(d, rp.feats, tp.feats)));
        ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.shadowColor = WARM(g.alpha); ctx.shadowBlur = 22; ctx.strokeStyle = `rgba(194,163,122,${g.alpha})`; ctx.lineWidth = 4;
        polyline(ctx, V, pts2); ctx.stroke(); ctx.restore();
      }
      const a = anchors(rp, true);
      let lo = 0, hi = 0;
      if (g.alpha > .004 && g.center != null) {
        const e1 = ledAt(g.center - g.half, a), e2 = ledAt(g.center + g.half, a);
        lo = Math.min(e1, e2) - .5; hi = Math.max(e1, e2) + .5;
      }
      drawStrip(i => Math.pow(clamp(Math.min(i + .5, hi) - Math.max(i - .5, lo), 0, 1), 2.2) * g.alpha,
        pinFeats(rp).map(ff => S.pins[ff.key] != null ? {led: S.pins[ff.key], label: FEAT[ff.key].tag} : null).filter(Boolean));
    }

    // people on the stairs, smoothed in radar space, drawn on the template
    const seen = new Set(), ease = 1 - Math.exp(-dt * (simOn() ? 18 : 5));
    if (rp && !rec) ts.forEach((t, i) => {
      seen.add(i);
      const d = disp[i] || (disp[i] = {x: t.x, y: t.y});
      d.x += (t.x - d.x) * ease; d.y += (t.y - d.y) * ease;
      if (onStairs(d)) drawTarget(ctx, V, toTemplate(rp, tp, d).pt, i === used);
    });
    for (const key of Object.keys(disp)) if (!seen.has(+key)) delete disp[key];
    drawScale(ctx, V, h, stripOn ? 70 : 0);

    const seeing = used >= 0;
    readout = rec ? `● REC &nbsp;${S.trail.length} SAMPLES &nbsp;·&nbsp; ${seeing ? 'SEEING YOU' : 'NO TARGET'}`
      : !rp ? (seeing ? 'SEEING YOU' : 'NO TARGET')
      : !seeing ? 'NO TARGET' : onStairs(ts[used]) ? 'ON THE STAIRS' : 'OFF THE STAIRS';
  }
  if ($('readout').innerHTML !== readout) $('readout').innerHTML = readout;
  requestAnimationFrame(frame);
}

if (S.screen > SC.walk && !S.cl) S.screen = SC.walk;
render();
requestAnimationFrame(frame);
})();
</script>
